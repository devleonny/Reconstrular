    <script>

        // Carimbado por scripts/versionar.js no commit; comparado com versao.json publicado.
        const versaoAtual = '4a292af1'

        verificarVersao()

        setInterval(verificarVersao, 5 * 60 * 1000)

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible')
                verificarVersao()
        })

        async function verificarVersao() {

            // O aviso no ecrã é o próprio controle: fechado por "Lembrar mais tarde", volta no próximo ciclo.
            if (document.querySelector('.aviso-versao') || location.protocol === 'file:' || !versaoAtual)
                return

            try {
                const resposta = await fetch(`versao.json?t=${Date.now()}`, { cache: 'no-store' })
                if (!resposta.ok)
                    return

                const { versao = null } = await resposta.json()

                if (!versao || versao === String(versaoAtual) || document.querySelector('.aviso-versao'))
                    return

                balaoNotificacao({
                    imagem: 'imagens/atualizar.png',
                    texto: `
                        <div class="aviso-versao">
                            <strong>Nova versão disponível</strong>
                            <span>Atualize para carregar as últimas melhorias.</span>
                            <div class="aviso-versao-botoes">
                                <button type="button" class="aviso-versao-atualizar" onclick="atualizarVersao()">Atualizar agora</button>
                                <button type="button" class="aviso-versao-adiar" onclick="this.closest('.popup-mensagem').remove()">Lembrar mais tarde</button>
                            </div>
                        </div>`,
                    tempo: 0 // fica até a pessoa escolher
                })
            } catch {
                // Sem rede: tenta no próximo ciclo.
            }

        }

        // Pede ao Service Worker a versão nova e renova o index.html no cache do navegador antes de recarregar.
        async function atualizarVersao() {
            try { await (await navigator.serviceWorker?.getRegistration())?.update() } catch { }
            try { await fetch(location.href, { cache: 'reload' }) } catch { }
            location.reload()
        }

    </script>
